[package]
name = "maestro-rs"
version = "0.3.0"
authors = ["Skynõx <0x536b796ec3b578@proton.me>"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/0x536b796ec3b578/maestro"
license = "MIT"
description = "A lightweight, fast, and ergonomic framework for building TCP & UDP servers in Rust with zero boilerplate."
readme = "README.md"
keywords = [
    "networking",
    "tcp",
    "udp",
    "concurrency",
    "tokio"
]
categories = [
    "network-programming",
    "asynchronous",
    "concurrency",
]

[features]
default = ["tracing"]
## Emit logs through the `tracing` facade.
tracing = ["dep:tracing"]

[dependencies]
getifaddrs = "0.6.0"
socket2 = "0.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "signal", "time"] }
tokio-util = "0.7.17"
tracing = { version = "0.1.41", optional = true }

[dev-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
tracing = "0.1.41"
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.bench]
# Keep symbols so `perf`, `samply` or Instruments can profile `cargo bench` runs.
debug = true

[[bench]]
name = "tcp"
harness = false

[[bench]]
name = "udp"
harness = false
